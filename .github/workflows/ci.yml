name: retrie CI

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        ghc: ['9.6.7', '9.8.4', '9.12.2', '9.14.1']
        os: [ubuntu-latest, macos-latest]
    name: GHC ${{ matrix.ghc }} (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install System Packages (macOS)
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: |
          brew install mercurial

      - name: Install System Packages (Linux)
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          sudo apt-get install mercurial

      - name: Setup GHC
        id: setup
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}

      - name: Check Versions
        shell: bash
        run: |
          ghc --version
          cabal --version

      - name: Run cabal update
        run: cabal update

      - name: Resolve Dependencies
        # Writes dist-newstyle/cache/plan.json, which is hashed into the
        # cache key. The key must stay identical to the one in cache.yml.
        shell: bash
        run: cabal build --enable-tests --dry-run

      - name: Restore Cabal Store
        # Read-only: the cache is populated by cache.yml on main. A partial
        # hit via restore-keys means the build below compiles only the
        # dependencies that differ from the closest cached plan.
        uses: actions/cache/restore@v6
        env:
          key: ${{ runner.os }}-${{ runner.arch }}-ghc-${{ steps.setup.outputs.ghc-version }}-cabal-${{ steps.setup.outputs.cabal-version }}
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ env.key }}-plan-${{ hashFiles('dist-newstyle/cache/plan.json') }}
          restore-keys: ${{ env.key }}-

      - name: Build
        shell: bash
        run: cabal build --enable-tests

      - name: Haddock
        shell: bash
        run: cabal haddock --enable-tests --disable-documentation

      - name: Test
        shell: bash
        run: cabal test --enable-tests

